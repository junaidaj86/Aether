spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/aether
    username: aether
    password: ${AETHER_DB_PASSWORD:aether_dev_password}

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.aether: DEBUG
