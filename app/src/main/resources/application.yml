spring:
  application:
    name: aether

  profiles:
    default: dev

  config:
    import:
      - classpath:config/database.yml
      - classpath:config/security.yml

  logging:
    pattern:
      console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [correlationId=%X{correlationId:-}] %logger{36} - %msg%n"
