services:
  postgres:
    image: postgres:17
    container_name: aether-postgres

    environment:
      POSTGRES_DB: aether
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether_dev_password

    ports:
      - "5432:5432"

    volumes:
      - aether_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether -d aether"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aether_postgres_data: